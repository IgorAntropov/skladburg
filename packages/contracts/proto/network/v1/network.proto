syntax = "proto3";

package network.v1;

import "common/v1/method_options.proto";
import "common/v1/page.proto";

message BoardPosition {
  int32 column = 1;
  int32 row = 2;
}

message City {
  string id = 1;
  string name = 2;
  string time_zone = 3;
}

message BoardNode {
  string id = 1;
  BoardPosition position = 2;
  string city_id = 3;
}

message ListCitiesRequest {
  common.v1.PageRequest page = 1;
}

message ListCitiesResponse {
  repeated City cities = 1;
  common.v1.PageResponse page = 2;
}

message ListBoardNodesRequest {
  common.v1.PageRequest page = 1;
}

message ListBoardNodesResponse {
  repeated BoardNode board_nodes = 1;
  common.v1.PageResponse page = 2;
}

service NetworkService {
  rpc ListCities(ListCitiesRequest) returns (ListCitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).session = {};
  }

  rpc ListBoardNodes(ListBoardNodesRequest) returns (ListBoardNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).session = {};
  }
}

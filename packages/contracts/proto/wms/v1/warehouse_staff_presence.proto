syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";

enum WarehouseStaffAreaKind {
  WAREHOUSE_STAFF_AREA_KIND_UNSPECIFIED = 0;
  WAREHOUSE_STAFF_AREA_KIND_RECEIVING = 1;
  WAREHOUSE_STAFF_AREA_KIND_STORAGE = 2;
}

message WarehouseStaffAreaPresence {
  string area_id = 1;
  WarehouseStaffAreaKind kind = 2;
  uint32 observed_staff_count = 3;
  string area_code = 4;
  optional uint32 planned_staff_count = 5;
}

message WarehouseStaffShiftSummary {
  uint32 on_shift_count = 1;
  uint32 on_break_count = 2;
  uint32 off_site_count = 3;
}

message GetWarehouseStaffPresenceRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWarehouseStaffPresenceResponse {
  repeated WarehouseStaffAreaPresence areas = 1;
  WarehouseStaffShiftSummary shift = 2;
}

service WarehouseStaffPresenceService {
  rpc GetWarehouseStaffPresence(GetWarehouseStaffPresenceRequest) returns (GetWarehouseStaffPresenceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "staff_view"
      scope_field: "warehouse_id"
    };
  }
}

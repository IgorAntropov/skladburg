syntax = "proto3";

package logistics.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";

message SubmitCarrierTitleRequest {
  string trip_id = 1 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 2 [(buf.validate.field).int32.gt = 0];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
}

message SubmitCarrierTitleResponse {}

service TripDocumentsService {
  rpc SubmitCarrierTitle(SubmitCarrierTitleRequest) returns (SubmitCarrierTitleResponse) {
    option (common.v1.access).permission.name = "trip_edit";
  }
}

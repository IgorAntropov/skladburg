syntax = "proto3";

package import.v1;

import "buf/validate/validate.proto";
import "catalog/v1/catalog.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "google/protobuf/timestamp.proto";

enum ImportStatus {
  IMPORT_STATUS_UNSPECIFIED = 0;
  IMPORT_STATUS_PREVIEW = 1;
  IMPORT_STATUS_COMMITTED = 2;
  IMPORT_STATUS_ROLLED_BACK = 3;
}

message ImportColumn {
  string key = 1;
  string field_path = 2;
  bool is_required = 3;
  repeated string aliases = 4;
  string title_key = 5;
}

message ImportEnumValue {
  string column_key = 1;
  string value = 2;
  repeated string aliases = 3;
}

message ImportTemplate {
  string id = 1;
  repeated ImportColumn columns = 2;
  repeated ImportEnumValue enum_values = 3;
  string currency_code = 4;
}

message ImportRowError {
  int32 row_number = 1;
  int32 column_number = 2;
  string field_path = 3;
  string rule_id = 4;
}

message ImportRow {
  int32 row_number = 1;
  repeated string values = 2;
  catalog.v1.Product product = 3;
  catalog.v1.Listing listing = 4;
  catalog.v1.ListingPrice price = 5;
  repeated ImportRowError errors = 6;
}

message ImportJob {
  string id = 1;
  string tenant_id = 2;
  string author_user_id = 3;
  string template_id = 4;
  string file_name = 5;
  ImportStatus status = 6;
  int32 row_count = 7;
  int32 error_count = 8;
  int64 version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message GetImportTemplateRequest {
  string template_id = 1 [(buf.validate.field).string.const = "catalog"];
}
message GetImportTemplateResponse {
  ImportTemplate template = 1;
}
message PreviewImportRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  string template_id = 2 [(buf.validate.field).string.const = "catalog"];
  string file_name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 200
  ];
  bytes file_bytes = 4 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 5242880
  ];
}
message PreviewImportResponse {
  ImportJob job = 1;
}
message GetImportJobRequest {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
  bool has_errors_only = 3;
}
message GetImportJobResponse {
  ImportJob job = 1;
  repeated ImportRow rows = 2;
  common.v1.PageResponse page = 3;
}
message CommitImportRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  string job_id = 2 [(buf.validate.field).string.uuid = true];
  int64 expected_version = 3 [(buf.validate.field).int64.gt = 0];
}
message CommitImportResponse {
  ImportJob job = 1;
}
message RollbackImportRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  string job_id = 2 [(buf.validate.field).string.uuid = true];
  int64 expected_version = 3 [(buf.validate.field).int64.gt = 0];
}
message RollbackImportResponse {
  ImportJob job = 1;
}
message ListImportJobsRequest {
  common.v1.PageRequest page = 1;
}
message ListImportJobsResponse {
  repeated ImportJob jobs = 1;
  common.v1.PageResponse page = 2;
}

service ImportService {
  rpc GetImportTemplate(GetImportTemplateRequest) returns (GetImportTemplateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "import_view";
  }
  rpc PreviewImport(PreviewImportRequest) returns (PreviewImportResponse) {
    option (common.v1.access).permission.name = "import_create";
  }
  rpc GetImportJob(GetImportJobRequest) returns (GetImportJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "import_view";
  }
  rpc CommitImport(CommitImportRequest) returns (CommitImportResponse) {
    option (common.v1.access).permission.name = "import_create";
  }
  rpc RollbackImport(RollbackImportRequest) returns (RollbackImportResponse) {
    option (common.v1.access).permission.name = "import_create";
  }
  rpc ListImportJobs(ListImportJobsRequest) returns (ListImportJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "import_view";
  }
}

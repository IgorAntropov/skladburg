syntax = "proto3";

package organization.v1;

import "buf/validate/validate.proto";
import "common/v1/date.proto";
import "common/v1/field_options.proto";
import "common/v1/method_options.proto";

enum VatMode {
  VAT_MODE_UNSPECIFIED = 0;
  VAT_MODE_GENERAL = 1;
  VAT_MODE_SIMPLIFIED_WITH_VAT = 2;
  VAT_MODE_WITHOUT_VAT = 3;
}

enum SignatoryBasis {
  SIGNATORY_BASIS_UNSPECIFIED = 0;
  SIGNATORY_BASIS_CHARTER = 1;
  SIGNATORY_BASIS_POWER_OF_ATTORNEY = 2;
}

message BankAccount {
  string bik = 1 [
    (buf.validate.field).string.pattern = "^04[0-9]{7}$",
    (common.v1.field_check) = FIELD_CHECK_BIK
  ];
  string bank_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 200
  ];
  string settlement_account = 3 [
    (buf.validate.field).string.pattern = "^[0-9]{20}$",
    (common.v1.field_check) = FIELD_CHECK_SETTLEMENT_ACCOUNT
  ];
  string correspondent_account = 4 [
    (buf.validate.field).string.pattern = "^[0-9]{20}$",
    (common.v1.field_check) = FIELD_CHECK_CORRESPONDENT_ACCOUNT
  ];
}

message Signatory {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string full_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 200
  ];
  string position = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 120
  ];
  SignatoryBasis basis = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  string power_of_attorney_number = 5 [(buf.validate.field).string.max_len = 40];
  common.v1.CalendarDate power_of_attorney_date = 6;
  bool is_default = 7;
}

message OrganizationRequisites {
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
  string legal_address = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 500
  ];
  string time_zone = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z_]+(/[A-Za-z0-9_+-]+)+$"
  ];
  BankAccount bank = 4 [(buf.validate.field).required = true];
  VatMode vat_mode = 5 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  repeated Signatory signatories = 6 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 10
  ];
  int64 version = 7;
}

message GetOrganizationRequisitesRequest {}

message GetOrganizationRequisitesResponse {
  OrganizationRequisites requisites = 1;
}

message UpdateOrganizationRequisitesRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  int64 expected_version = 2 [(buf.validate.field).int64.gte = 1];
  string legal_address = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 500
  ];
  VatMode vat_mode = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  BankAccount bank = 5 [(buf.validate.field).required = true];
}

message UpdateOrganizationRequisitesResponse {
  OrganizationRequisites requisites = 1;
}

service OrganizationRequisitesService {
  rpc GetOrganizationRequisites(GetOrganizationRequisitesRequest) returns (GetOrganizationRequisitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).member = {};
  }

  rpc UpdateOrganizationRequisites(UpdateOrganizationRequisitesRequest) returns (UpdateOrganizationRequisitesResponse) {
    option (common.v1.access).permission.name = "organization_manage";
  }
}

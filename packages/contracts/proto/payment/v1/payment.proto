syntax = "proto3";

package payment.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";
import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

enum SafeDealPaymentStatus {
  SAFE_DEAL_PAYMENT_STATUS_UNSPECIFIED = 0;
  SAFE_DEAL_PAYMENT_STATUS_INVOICED = 1;
  SAFE_DEAL_PAYMENT_STATUS_AWAITING_FUNDS = 2;
  SAFE_DEAL_PAYMENT_STATUS_BLOCKED = 3;
  SAFE_DEAL_PAYMENT_STATUS_HELD = 4;
  SAFE_DEAL_PAYMENT_STATUS_DISPUTE = 5;
  SAFE_DEAL_PAYMENT_STATUS_TO_PAYOUT = 6;
  SAFE_DEAL_PAYMENT_STATUS_PAID_OUT = 7;
  SAFE_DEAL_PAYMENT_STATUS_REFUNDED = 8;
  SAFE_DEAL_PAYMENT_STATUS_CLOSED = 9;
}

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING = 1;
  PAYOUT_STATUS_PAID = 2;
}

message SafeDealPayout {
  string organization_id = 1;
  common.v1.Money amount = 2;
  PayoutStatus status = 3;
  google.protobuf.Timestamp paid_at = 4;
}

message SafeDealPaymentTransition {
  SafeDealPaymentStatus from = 1;
  SafeDealPaymentStatus to = 2;
  google.protobuf.Timestamp at = 3;
}

message TransportPaymentBreakdown {
  common.v1.Money shipping_amount = 1;
  common.v1.Money commission_amount = 2;
  int32 commission_rate_basis_points = 3;
  SafeDealPayout carrier_payout = 4;
}

message TransportSettlement {
  string trip_id = 1;
  string payer_organization_id = 2;
  string carrier_organization_id = 3;
  common.v1.Money shipping_amount = 4;
  common.v1.Money carrier_commission = 5;
  common.v1.Money supplier_payout = 6;
  common.v1.Money carrier_payout = 7;
  common.v1.Money funded_amount = 8;
}

message PartialReceiptSettlement {
  common.v1.Money accepted_goods_amount = 1;
  common.v1.Money disputed_goods_amount = 2;
  common.v1.Money accepted_goods_commission = 3;
  common.v1.Money held_transport_amount = 4;
}

message SafeDealPayment {
  string id = 1;
  string deal_id = 2;
  SafeDealPaymentStatus status = 3;
  common.v1.Money goods_amount = 4;
  common.v1.Money delivery_amount = 5;
  common.v1.Money commission_amount = 6;
  int32 commission_rate_basis_points = 7;
  repeated SafeDealPayout payouts = 8;
  string bank_reference = 9;
  repeated SafeDealPaymentTransition transitions = 10;
  int32 version = 11;
  common.v1.Money funded_amount = 12;
  TransportPaymentBreakdown transport = 13;
  PartialReceiptSettlement partial_receipt = 14;
}

message SafeDealPaymentRecord {
  string id = 1;
  SafeDealPayment payment = 2;
  google.protobuf.Timestamp bank_due_at = 3;
  bool acceptance_notice_sent = 4;
  TransportSettlement transport_settlement = 5;
}

message GetDealPaymentRequest {
  string deal_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetDealPaymentResponse {
  SafeDealPayment payment = 1;
}

message FundDealRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 2 [(buf.validate.field).int32.gte = 0];
  string deal_id = 3 [(buf.validate.field).string.uuid = true];
  common.v1.Money amount = 4 [(buf.validate.field).required = true];
}

message FundDealResponse {
  SafeDealPayment payment = 1;
}

service PaymentService {
  rpc GetDealPayment(GetDealPaymentRequest) returns (GetDealPaymentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "payment_view";
  }

  rpc FundDeal(FundDealRequest) returns (FundDealResponse) {
    option (common.v1.access).permission.name = "payment_fund";
    option (common.v1.access).permission.limit_field = "amount";
  }
}

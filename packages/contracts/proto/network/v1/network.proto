syntax = "proto3";

package network.v1;

import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "organization/v1/organization.proto";

message MapPosition {
  int32 column = 1;
  int32 row = 2;
}

enum CityTier {
  CITY_TIER_UNSPECIFIED = 0;
  CITY_TIER_SMALL = 1;
  CITY_TIER_MEDIUM = 2;
  CITY_TIER_LARGE = 3;
}

message City {
  string id = 1;
  string name = 2;
  string time_zone = 3;
  CityTier tier = 4;
}

message MapNode {
  string id = 1;
  MapPosition position = 2;
  string city_id = 3;
}

message RouteLeg {
  string id = 1;
  string from_map_node_id = 2;
  string to_map_node_id = 3;
  int32 distance_km = 4;
  int32 drive_minutes = 5;
}

enum MapSiteKind {
  MAP_SITE_KIND_UNSPECIFIED = 0;
  MAP_SITE_KIND_WAREHOUSE = 1;
}

message MapSite {
  string id = 1;
  MapSiteKind kind = 2;
  string organization_id = 3;
  string organization_name = 4;
  organization.v1.ProfileKind profile_kind = 5;
  string city_id = 6;
  string map_node_id = 7;
  string name = 8;
  organization.v1.OrganizationLogo organization_logo = 9;
}

message ListCitiesRequest {
  common.v1.PageRequest page = 1;
}

message ListCitiesResponse {
  repeated City cities = 1;
  common.v1.PageResponse page = 2;
}

message ListMapNodesRequest {
  common.v1.PageRequest page = 1;
}

message ListMapNodesResponse {
  repeated MapNode map_nodes = 1;
  common.v1.PageResponse page = 2;
}

message ListRouteLegsRequest {
  common.v1.PageRequest page = 1;
}

message ListRouteLegsResponse {
  repeated RouteLeg route_legs = 1;
  common.v1.PageResponse page = 2;
}

message ListMapSitesRequest {
  common.v1.PageRequest page = 1;
}

message ListMapSitesResponse {
  repeated MapSite map_sites = 1;
  common.v1.PageResponse page = 2;
}

service NetworkService {
  rpc ListCities(ListCitiesRequest) returns (ListCitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).session = {};
  }

  rpc ListMapNodes(ListMapNodesRequest) returns (ListMapNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).session = {};
  }

  rpc ListRouteLegs(ListRouteLegsRequest) returns (ListRouteLegsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).session = {};
  }

  rpc ListMapSites(ListMapSitesRequest) returns (ListMapSitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "network_view";
  }
}

syntax = "proto3";

package event.v1;

import "access/v1/access.proto";
import "google/protobuf/timestamp.proto";
import "notification/v1/notification_events.proto";
import "organization/v1/organization.proto";
import "support/v1/support_events.proto";

message Event {
  string channel = 1;
  uint64 seq = 2;
  string epoch = 3;
  google.protobuf.Timestamp occurred_at = 4;
  oneof payload {
    organization.v1.WarehouseCreated warehouse_created = 10;
    organization.v1.WarehouseChanged warehouse_changed = 11;
    access.v1.UserChanged user_changed = 12;
    notification.v1.NotificationsChanged notifications_changed = 13;
    support.v1.SupportTicketChanged support_ticket_changed = 14;
    support.v1.SupportAccessChanged support_access_changed = 15;
  }
}

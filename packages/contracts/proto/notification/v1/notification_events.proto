syntax = "proto3";

package notification.v1;

enum NotificationsChange {
  NOTIFICATIONS_CHANGE_UNSPECIFIED = 0;
  NOTIFICATIONS_CHANGE_POSTED = 1;
  NOTIFICATIONS_CHANGE_READ = 2;
  NOTIFICATIONS_CHANGE_UPDATED = 3;
}

message NotificationsChanged {
  NotificationsChange change = 1;
  repeated string notification_ids = 2;
}

syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "catalog/v1/catalog.proto";
import "common/v1/date.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "google/protobuf/timestamp.proto";
import "wms/v1/stock.proto";

enum ReceivingTaskStatus {
  RECEIVING_TASK_STATUS_UNSPECIFIED = 0;
  RECEIVING_TASK_STATUS_OPEN = 1;
  RECEIVING_TASK_STATUS_IN_PROGRESS = 2;
  RECEIVING_TASK_STATUS_READY_FOR_RECONCILIATION = 3;
  RECEIVING_TASK_STATUS_RECONCILED = 4;
}

enum YardAdmissionStatus {
  YARD_ADMISSION_STATUS_UNSPECIFIED = 0;
  YARD_ADMISSION_STATUS_PASS_REJECTED = 1;
  YARD_ADMISSION_STATUS_WAITING_DOCUMENTS = 2;
  YARD_ADMISSION_STATUS_ADMITTED = 3;
  YARD_ADMISSION_STATUS_WAITING_DOCK = 4;
}

message ReceivingOrderLine {
  string deal_line_id = 1;
  string product_id = 2;
  string product_name = 3;
  string gtin = 4;
  catalog.v1.BaseUnit base_unit = 5;
  int64 quantity_base = 6;
  catalog.v1.MarkingMode marking_mode = 7;
}

message ExpectedReceivingBatch {
  string deal_line_id = 1;
  string batch_number = 2;
  common.v1.CalendarDate expires_on = 3;
  int64 quantity_base = 4;
  repeated string marking_codes = 5;
}

message ExpectedReceivingUnit {
  string id = 1;
  optional string sscc = 2;
  HandlingUnitKind kind = 3;
  repeated ExpectedReceivingBatch batches = 4;
}

message ReceivingBatchFact {
  int32 batch_index = 1;
  int64 quantity_base = 2;
  int64 defective_quantity_base = 3;
  repeated string marking_codes = 4;
  repeated string defective_marking_codes = 5;
}

message ReceivedHandlingUnit {
  string expected_unit_id = 1;
  StockBalance balance_at_receipt = 2;
  google.protobuf.Timestamp received_at = 3;
  optional string put_away_cell_id = 4;
  google.protobuf.Timestamp put_away_at = 5;
  repeated ReceivingBatchFact batch_facts = 6;
}

enum DockSlotRescheduleReason {
  DOCK_SLOT_RESCHEDULE_REASON_UNSPECIFIED = 0;
  DOCK_SLOT_RESCHEDULE_REASON_LATE_ARRIVAL = 1;
  DOCK_SLOT_RESCHEDULE_REASON_LATE_DOCUMENTS = 2;
  DOCK_SLOT_RESCHEDULE_REASON_SLOT_UNAVAILABLE = 3;
  DOCK_SLOT_RESCHEDULE_REASON_DOCK_BUSY = 4;
  DOCK_SLOT_RESCHEDULE_REASON_DOCK_CHANGED = 5;
  DOCK_SLOT_RESCHEDULE_REASON_SLOT_EXPIRED = 6;
}

message DockSlotReservation {
  string unloading_point_id = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
}

message ReceivingDockSchedule {
  google.protobuf.Timestamp preferred_starts_at = 1;
  DockSlotReservation reservation = 2;
  DockSlotRescheduleReason last_reschedule_reason = 3;
}

message ReceivingTask {
  string id = 1;
  string warehouse_id = 2;
  string deal_id = 3;
  ReceivingTaskStatus status = 4;
  int32 version = 5;
  optional string assignee_user_id = 6;
  string receiving_area_id = 7;
  string source_document_number = 8;
  repeated ReceivingOrderLine order_lines = 9;
  repeated ExpectedReceivingUnit expected_units = 10;
  repeated ReceivedHandlingUnit received_units = 11;
  google.protobuf.Timestamp finished_at = 12;
  optional string upd_document_id = 13;
  optional string unloading_point_id = 14;
  YardAdmissionStatus yard_admission_status = 15;
  ReceivingDockSchedule dock_schedule = 16;
}

message ListReceivingTasksRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListReceivingTasksResponse {
  repeated ReceivingTask tasks = 1;
  common.v1.PageResponse page = 2;
}

enum YardWaitingReasonCode {
  YARD_WAITING_REASON_CODE_UNSPECIFIED = 0;
  YARD_WAITING_REASON_CODE_PASS_REJECTED = 1;
  YARD_WAITING_REASON_CODE_WAITING_DOCUMENTS = 2;
  YARD_WAITING_REASON_CODE_NO_COMPATIBLE_DOCK = 3;
  YARD_WAITING_REASON_CODE_WAITING_SLOT = 4;
  YARD_WAITING_REASON_CODE_BOOKED_DOCK_BUSY = 5;
  YARD_WAITING_REASON_CODE_DOCKS_BUSY = 6;
  YARD_WAITING_REASON_CODE_WAITING_ASSIGNMENT = 7;
}

enum YardPriorityFactor {
  YARD_PRIORITY_FACTOR_UNSPECIFIED = 0;
  YARD_PRIORITY_FACTOR_EXPLICIT_URGENCY = 1;
  YARD_PRIORITY_FACTOR_COLD_CARGO = 2;
  YARD_PRIORITY_FACTOR_EXPIRING_CARGO = 3;
  YARD_PRIORITY_FACTOR_DELIVERY_WINDOW = 4;
  YARD_PRIORITY_FACTOR_WAITING_TIME = 5;
  YARD_PRIORITY_FACTOR_AVAILABLE_RESOURCES = 6;
  YARD_PRIORITY_FACTOR_STARTED_RECEIPT = 7;
}

message YardWaitingReason {
  string receiving_task_id = 1;
  int32 task_version = 2;
  YardWaitingReasonCode reason = 3;
  repeated YardPriorityFactor priority_factors = 4;
}

message ListYardWaitingReasonsRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListYardWaitingReasonsResponse {
  repeated YardWaitingReason reasons = 1;
  common.v1.PageResponse page = 2;
}

message ClaimReceivingTaskRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
}

message ClaimReceivingTaskResponse {
  ReceivingTask task = 1;
}

message UnlabelledReceivingUnit {
  string expected_unit_id = 1 [(buf.validate.field).string.uuid = true];
  string gtin = 2 [(buf.validate.field).string.pattern = "^([0-9]{8}|[0-9]{12,14})$"];
  int64 quantity_base = 3 [(buf.validate.field).int64.gt = 0];
}

message ReceivingBatchEvidence {
  int32 batch_index = 1 [(buf.validate.field).int32.gte = 0];
  optional int64 quantity_base = 2 [(buf.validate.field).int64.gte = 0];
  int64 defective_quantity_base = 3 [(buf.validate.field).int64.gte = 0];
  repeated string marking_codes = 4 [
    (buf.validate.field).repeated.max_items = 1000,
    (buf.validate.field).repeated.items.string = {
      min_len: 1
      max_len: 128
    }
  ];
  repeated string defective_marking_codes = 5 [
    (buf.validate.field).repeated.max_items = 1000,
    (buf.validate.field).repeated.items.string = {
      min_len: 1
      max_len: 128
    }
  ];
}

message ReceiveHandlingUnitRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
  oneof unit {
    option (buf.validate.oneof).required = true;

    string sscc = 5 [(buf.validate.field).string.pattern = "^[0-9]{18}$"];
    UnlabelledReceivingUnit unlabelled_unit = 6;
  }
  repeated ReceivingBatchEvidence batch_evidence = 7 [(buf.validate.field).repeated.max_items = 100];
}

message ReceiveHandlingUnitResponse {
  ReceivingTask task = 1;
}

message FinishReceivingTaskRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
}

message FinishReceivingTaskResponse {
  ReceivingTask task = 1;
}

message PutAwayHandlingUnitRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
  string handling_unit_id = 5 [(buf.validate.field).string.uuid = true];
  string to_cell_id = 6 [(buf.validate.field).string.uuid = true];
}

message PutAwayHandlingUnitResponse {
  ReceivingTask task = 1;
}

service WarehouseReceivingService {
  rpc ListReceivingTasks(ListReceivingTasksRequest) returns (ListReceivingTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "task_view"
      scope_field: "warehouse_id"
    };
  }
  rpc ListYardWaitingReasons(ListYardWaitingReasonsRequest) returns (ListYardWaitingReasonsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "task_view"
      scope_field: "warehouse_id"
    };
  }
  rpc ClaimReceivingTask(ClaimReceivingTaskRequest) returns (ClaimReceivingTaskResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc ReceiveHandlingUnit(ReceiveHandlingUnitRequest) returns (ReceiveHandlingUnitResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc FinishReceivingTask(FinishReceivingTaskRequest) returns (FinishReceivingTaskResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc PutAwayHandlingUnit(PutAwayHandlingUnitRequest) returns (PutAwayHandlingUnitResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
}

syntax = "proto3";

package event.v1;

import "access/v1/access.proto";
import "catalog/v1/catalog_events.proto";
import "deal/v1/deal_events.proto";
import "google/protobuf/timestamp.proto";
import "logistics/v1/logistics_events.proto";
import "notification/v1/notification_events.proto";
import "organization/v1/organization.proto";
import "support/v1/support_events.proto";
import "wms/v1/picking_events.proto";
import "wms/v1/receiving_events.proto";
import "wms/v1/stock_events.proto";

message Event {
  string channel = 1;
  uint64 seq = 2;
  string epoch = 3;
  google.protobuf.Timestamp occurred_at = 4;
  oneof payload {
    organization.v1.WarehouseCreated warehouse_created = 10;
    organization.v1.WarehouseChanged warehouse_changed = 11;
    access.v1.UserChanged user_changed = 12;
    notification.v1.NotificationsChanged notifications_changed = 13;
    support.v1.SupportTicketChanged support_ticket_changed = 14;
    support.v1.SupportAccessChanged support_access_changed = 15;
    catalog.v1.ListingsChanged listings_changed = 16;
    deal.v1.DealChanged deal_changed = 17;
    logistics.v1.TransportRequestChanged transport_request_changed = 18;
    wms.v1.StockChanged stock_changed = 19;
    wms.v1.PickingTasksChanged picking_tasks_changed = 20;
    wms.v1.ReceivingTasksChanged receiving_tasks_changed = 21;
  }
}

syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";
import "common/v1/warehouse_sensor_alert.proto";
import "google/protobuf/timestamp.proto";

enum WarehouseSensorChannelKind {
  WAREHOUSE_SENSOR_CHANNEL_KIND_UNSPECIFIED = 0;
  WAREHOUSE_SENSOR_CHANNEL_KIND_TEMPERATURE = 1;
  WAREHOUSE_SENSOR_CHANNEL_KIND_HUMIDITY = 2;
  WAREHOUSE_SENSOR_CHANNEL_KIND_DOOR = 3;
  WAREHOUSE_SENSOR_CHANNEL_KIND_CO2 = 4;
}

message WarehouseSensorReading {
  google.protobuf.Timestamp measured_at = 1 [(buf.validate.field).required = true];
  oneof value {
    option (buf.validate.oneof).required = true;
    sint32 deci_celsius = 2;
    uint32 relative_humidity_percent = 3 [(buf.validate.field).uint32.lte = 100];
    bool door_open = 4;
    uint32 co2_ppm = 5;
  }
}

message WarehouseSensorChannel {
  string id = 1;
  WarehouseSensorChannelKind kind = 2;
  repeated WarehouseSensorReading readings = 3 [(buf.validate.field).repeated.max_items = 60];
  common.v1.WarehouseSensorAlert alert = 4;
}

message WarehouseSensorDevice {
  string id = 1;
  string code = 2;
  string zone_id = 3;
  repeated WarehouseSensorChannel channels = 4;
}

message GetWarehouseSensorsRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWarehouseSensorsResponse {
  repeated WarehouseSensorDevice devices = 1;
}

service WarehouseSensorService {
  rpc GetWarehouseSensors(GetWarehouseSensorsRequest) returns (GetWarehouseSensorsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "sensor_view"
      scope_field: "warehouse_id"
    };
  }
}

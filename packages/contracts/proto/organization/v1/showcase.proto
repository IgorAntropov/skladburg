syntax = "proto3";

package organization.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "organization/v1/organization.proto";

message OrganizationShowcase {
  string id = 1;
  string name = 2;
  repeated OrganizationProfile profiles = 3;
  repeated string sphere_ids = 4;
}

message ListOrganizationShowcasesRequest {
  common.v1.PageRequest page = 1;
  ProfileKind profile_kind = 2 [(buf.validate.field).enum.defined_only = true];
  string sphere_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  int32 min_verification_level = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 4
  ];
}

message ListOrganizationShowcasesResponse {
  repeated OrganizationShowcase organizations = 1;
  common.v1.PageResponse page = 2;
}

message GetOrganizationShowcaseRequest {
  string organization_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetOrganizationShowcaseResponse {
  OrganizationShowcase organization = 1;
}

service OrganizationShowcaseService {
  rpc ListOrganizationShowcases(ListOrganizationShowcasesRequest) returns (ListOrganizationShowcasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "network_view";
  }

  rpc GetOrganizationShowcase(GetOrganizationShowcaseRequest) returns (GetOrganizationShowcaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "network_view";
  }
}

syntax = "proto3";

package wms.v1;

import "wms/v1/warehouse_equipment.proto";

message WarehouseEquipmentUnitRecord {
  WarehouseEquipmentUnit unit = 1;
  int64 updated_at_ms = 2;
}

message WarehouseEquipmentRecord {
  string warehouse_id = 1;
  string tenant_id = 2;
  repeated WarehouseEquipmentUnitRecord equipment = 3;
  repeated WarehouseChargingStation stations = 4;
}

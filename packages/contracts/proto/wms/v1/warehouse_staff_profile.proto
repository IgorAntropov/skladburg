syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/date.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "common/v1/warehouse_staff_qualification.proto";
import "google/protobuf/timestamp.proto";

enum WarehouseStaffWorkRole {
  WAREHOUSE_STAFF_WORK_ROLE_UNSPECIFIED = 0;
  WAREHOUSE_STAFF_WORK_ROLE_SHIFT_LEAD = 1;
  WAREHOUSE_STAFF_WORK_ROLE_STOREKEEPER = 2;
  WAREHOUSE_STAFF_WORK_ROLE_FORKLIFT_OPERATOR = 3;
  WAREHOUSE_STAFF_WORK_ROLE_CONTROLLER = 4;
  WAREHOUSE_STAFF_WORK_ROLE_PICKER = 5;
}

enum WarehouseStaffShiftState {
  WAREHOUSE_STAFF_SHIFT_STATE_UNSPECIFIED = 0;
  WAREHOUSE_STAFF_SHIFT_STATE_ON_SHIFT = 1;
  WAREHOUSE_STAFF_SHIFT_STATE_ON_BREAK = 2;
  WAREHOUSE_STAFF_SHIFT_STATE_OFF_SITE = 3;
}

enum WarehouseStaffTaskKind {
  WAREHOUSE_STAFF_TASK_KIND_UNSPECIFIED = 0;
  WAREHOUSE_STAFF_TASK_KIND_RECEIVING = 1;
  WAREHOUSE_STAFF_TASK_KIND_PICKING = 2;
}

enum WarehouseStaffQualificationStatus {
  WAREHOUSE_STAFF_QUALIFICATION_STATUS_UNSPECIFIED = 0;
  WAREHOUSE_STAFF_QUALIFICATION_STATUS_VALID = 1;
  WAREHOUSE_STAFF_QUALIFICATION_STATUS_EXPIRING = 2;
  WAREHOUSE_STAFF_QUALIFICATION_STATUS_EXPIRED = 3;
}

message WarehouseStaffSummary {
  string staff_id = 1;
  string warehouse_id = 2;
  string display_name = 3;
  WarehouseStaffWorkRole work_role = 4;
  string avatar_key = 5;
  string warehouse_name = 6;
}

message WarehouseStaffTask {
  string task_id = 1;
  WarehouseStaffTaskKind kind = 2;
  string reference = 3;
  google.protobuf.Timestamp completed_at = 4;
}

message WarehouseStaffWork {
  repeated WarehouseStaffTask active_tasks = 1;
  optional WarehouseStaffShiftState shift_state = 2;
}

message WarehouseStaffQualification {
  common.v1.WarehouseStaffQualificationKind kind = 1;
  common.v1.CalendarDate expires_on = 2;
  WarehouseStaffQualificationStatus status = 3;
}

message WarehouseStaffQualifications {
  repeated WarehouseStaffQualification entries = 1;
}

message WarehouseStaffPerformance {
  optional uint32 completed_this_shift = 1;
  uint32 completed_this_week = 2;
  repeated WarehouseStaffTask history = 3;
}

message WarehouseStaffProfile {
  WarehouseStaffSummary summary = 1;
  WarehouseStaffWork work = 2;
  WarehouseStaffQualifications qualifications = 3;
  WarehouseStaffPerformance performance = 4;
  string time_zone = 5;
}

message ListWarehouseStaffRequest {
  optional string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListWarehouseStaffResponse {
  repeated WarehouseStaffSummary staff = 1;
  common.v1.PageResponse page = 2;
}

message GetWarehouseStaffProfileRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string staff_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetWarehouseStaffProfileResponse {
  WarehouseStaffProfile profile = 1;
}

service WarehouseStaffProfileService {
  rpc ListWarehouseStaff(ListWarehouseStaffRequest) returns (ListWarehouseStaffResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {name: "staff_profile_view"};
  }
  rpc GetWarehouseStaffProfile(GetWarehouseStaffProfileRequest) returns (GetWarehouseStaffProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "staff_profile_view"
      scope_field: "warehouse_id"
    };
  }
}

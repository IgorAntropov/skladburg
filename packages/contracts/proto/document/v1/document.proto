syntax = "proto3";

package document.v1;

import "buf/validate/validate.proto";
import "catalog/v1/showcase.proto";
import "common/v1/date.proto";
import "common/v1/method_options.proto";
import "common/v1/money.proto";
import "common/v1/page.proto";
import "deal/v1/deal.proto";
import "google/protobuf/timestamp.proto";
import "organization/v1/organization.proto";
import "organization/v1/requisites.proto";

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_SUPPLY_CONTRACT = 1;
  DOCUMENT_TYPE_SPECIFICATION = 2;
  DOCUMENT_TYPE_INVOICE = 3;
  DOCUMENT_TYPE_UPD = 4;
  DOCUMENT_TYPE_DISPATCH_TITLE = 5;
  DOCUMENT_TYPE_RECEIPT_TITLE = 6;
  DOCUMENT_TYPE_RECEIPT_DISCREPANCY_ACT = 7;
  DOCUMENT_TYPE_RECEIPT_CLAIM = 8;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_DRAFT = 1;
  DOCUMENT_STATUS_APPROVED = 2;
  DOCUMENT_STATUS_SIGNED = 3;
  DOCUMENT_STATUS_ANNULLED = 4;
}

enum SignatureLevel {
  SIGNATURE_LEVEL_UNSPECIFIED = 0;
  SIGNATURE_LEVEL_INTERNAL = 1;
}

message DocumentSignature {
  string organization_id = 1;
  organization.v1.ProfileKind side = 2;
  string signer_role_name = 3;
  google.protobuf.Timestamp signed_at = 4;
  SignatureLevel level = 5;
  string content_sha256 = 6;
  string signer_user_id = 7;
  string signer_display_name = 8;
}

message DocumentParty {
  string organization_id = 1;
  string legal_name = 2;
  string inn = 3;
  string kpp = 4;
  string ogrn = 5;
  string legal_address = 6;
  organization.v1.BankAccount bank = 7;
  organization.v1.VatMode vat_mode = 8;
  organization.v1.Signatory signatory = 9;
}

message SupplyContractContent {
  int32 template_version = 1;
  string payment_terms = 2;
  string acceptance_terms = 3;
}

message SpecificationContent {
  repeated deal.v1.DealLine lines = 1;
  common.v1.Money goods_total = 2;
  common.v1.Money delivery_total = 3;
  catalog.v1.DeliveryMethod delivery_method = 4;
  common.v1.CalendarDate desired_date = 5;
  string ship_from_warehouse_id = 6;
  string ship_to_warehouse_id = 7;
}

message InvoiceContent {
  repeated deal.v1.DealLine lines = 1;
  common.v1.Money goods_total = 2;
  common.v1.Money delivery_total = 3;
  common.v1.Money total = 4;
}

message UpdLine {
  string deal_line_id = 1;
  string product_name = 2;
  int64 quantity_base = 3;
}

message UpdContent {
  repeated UpdLine lines = 1;
}

message DispatchTitleContent {
  string upd_document_id = 1;
  google.protobuf.Timestamp shipped_at = 2;
}

message ReceiptTitleContent {
  string upd_document_id = 1;
  repeated deal.v1.ReceiptLineComparison lines = 2;
  google.protobuf.Timestamp finished_at = 3;
}

message ReceiptDiscrepancyActContent {
  string upd_document_id = 1;
  repeated deal.v1.ReceiptLineComparison lines = 2;
  google.protobuf.Timestamp finished_at = 3;
}

message ReceiptClaimContent {
  string discrepancy_act_document_id = 1;
  common.v1.Money disputed_goods_amount = 2;
}

message DocumentContent {
  DocumentParty supplier = 1;
  DocumentParty customer = 2;
  oneof terms {
    SupplyContractContent supply_contract = 3;
    SpecificationContent specification = 4;
    InvoiceContent invoice = 5;
    UpdContent upd = 6;
    DispatchTitleContent dispatch_title = 7;
    ReceiptTitleContent receipt_title = 8;
    ReceiptDiscrepancyActContent receipt_discrepancy_act = 9;
    ReceiptClaimContent receipt_claim = 10;
  }
}

message Document {
  string id = 1;
  string deal_id = 2;
  string contract_id = 3;
  DocumentType type = 4;
  string issuer_organization_id = 5;
  int32 number = 6;
  string display_number = 7;
  common.v1.CalendarDate date = 8;
  DocumentStatus status = 9;
  repeated organization.v1.ProfileKind required_sides = 10;
  repeated DocumentSignature signatures = 11;
  DocumentContent content = 12;
  string corrects_document_id = 13;
  int32 correction_number = 14;
  int32 version = 15;
}

message DocumentNumberSequence {
  string id = 1;
  int32 last_number = 2;
}

message ListDealDocumentsRequest {
  string deal_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListDealDocumentsResponse {
  repeated Document documents = 1;
  common.v1.PageResponse page = 2;
}

message GetDocumentRequest {
  string deal_id = 1 [(buf.validate.field).string.uuid = true];
  string document_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetDocumentResponse {
  Document document = 1;
}

message SignDocumentRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 2 [(buf.validate.field).int32.gt = 0];
  string deal_id = 3 [(buf.validate.field).string.uuid = true];
  string document_id = 4 [(buf.validate.field).string.uuid = true];
}

message SignDocumentResponse {
  Document document = 1;
}

message SignSupplyContractRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 2 [(buf.validate.field).int32.gt = 0];
  string deal_id = 3 [(buf.validate.field).string.uuid = true];
  string document_id = 4 [(buf.validate.field).string.uuid = true];
}

message SignSupplyContractResponse {
  Document document = 1;
}

service DocumentService {
  rpc ListDealDocuments(ListDealDocumentsRequest) returns (ListDealDocumentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "document_view";
  }

  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "document_view";
  }

  rpc SignDocument(SignDocumentRequest) returns (SignDocumentResponse) {
    option (common.v1.access).permission.name = "document_sign";
  }

  rpc SignSupplyContract(SignSupplyContractRequest) returns (SignSupplyContractResponse) {
    option (common.v1.access).permission.name = "contract_sign";
  }
}

syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";

message WarehouseFloorPoint {
  uint32 x_mm = 1;
  uint32 z_mm = 2;
}

message WarehouseFloorRect {
  WarehouseFloorPoint origin = 1 [(buf.validate.field).required = true];
  uint32 width_mm = 2 [(buf.validate.field).uint32.gt = 0];
  uint32 depth_mm = 3 [(buf.validate.field).uint32.gt = 0];
}

message WarehouseCell {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Z0-9]+(-[A-Z0-9]+)*$"
  ];
  uint32 x_offset_mm = 3;
  uint32 width_mm = 4 [(buf.validate.field).uint32.gt = 0];
}

message WarehouseTier {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  uint32 elevation_mm = 3;
  repeated WarehouseCell cells = 4;
}

message WarehouseRack {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  WarehouseFloorRect footprint = 3 [(buf.validate.field).required = true];
  repeated WarehouseTier tiers = 4;
}

message WarehouseRow {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  repeated WarehouseRack racks = 3;
}

message WarehouseStorageZone {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  repeated WarehouseRow rows = 3;
}

message WarehouseUnloadingPoint {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  WarehouseFloorPoint position = 3 [(buf.validate.field).required = true];
}

message WarehouseReceivingArea {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  WarehouseFloorRect footprint = 3 [(buf.validate.field).required = true];
  WarehouseUnloadingPoint unloading_point = 4;
}

message WarehouseTopology {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string tenant_id = 2 [(buf.validate.field).string.uuid = true];
  uint32 revision = 3 [(buf.validate.field).uint32.gt = 0];
  repeated WarehouseStorageZone storage_zones = 4;
  WarehouseReceivingArea receiving_area = 5;
}

message GetWarehouseTopologyRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWarehouseTopologyResponse {
  WarehouseTopology topology = 1;
}

message WarehouseCellInput {
  string zone_code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string row_code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string rack_code = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string tier_code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  WarehouseFloorRect rack_footprint = 5;
  optional uint32 tier_elevation_mm = 6;
  string cell_code = 7 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[A-Z0-9]+(-[A-Z0-9]+)*$"
  ];
  uint32 x_offset_mm = 8;
  uint32 width_mm = 9 [(buf.validate.field).uint32.gt = 0];
}

message AddWarehouseCellsRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 2 [(buf.validate.field).string.uuid = true];
  optional uint32 expected_revision = 3 [(buf.validate.field).required = true];
  repeated WarehouseCellInput cells = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10000
  }];
}

message AddWarehouseCellsResponse {
  uint32 revision = 1;
}

service WarehouseTopologyService {
  rpc AddWarehouseCells(AddWarehouseCellsRequest) returns (AddWarehouseCellsResponse) {
    option (common.v1.access).permission = {
      name: "layout_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc GetWarehouseTopology(GetWarehouseTopologyRequest) returns (GetWarehouseTopologyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "warehouse_view"
      scope_field: "warehouse_id"
    };
  }
}

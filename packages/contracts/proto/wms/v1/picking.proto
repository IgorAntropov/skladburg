syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "google/protobuf/timestamp.proto";
import "wms/v1/stock.proto";

enum PickingTaskStatus {
  PICKING_TASK_STATUS_UNSPECIFIED = 0;
  PICKING_TASK_STATUS_OPEN = 1;
  PICKING_TASK_STATUS_IN_PROGRESS = 2;
  PICKING_TASK_STATUS_PICKED = 3;
  PICKING_TASK_STATUS_SHIPPED = 4;
  PICKING_TASK_STATUS_CANCELLED = 5;
}

message PickingTask {
  string id = 1;
  string warehouse_id = 2;
  string deal_id = 3;
  PickingTaskStatus status = 4;
  int32 version = 5;
  optional string assignee_user_id = 6;
  repeated StockBalance units = 7;
  google.protobuf.Timestamp picked_at = 8;
  google.protobuf.Timestamp shipped_at = 9;
}

message ListPickingTasksRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListPickingTasksResponse {
  repeated PickingTask tasks = 1;
  common.v1.PageResponse page = 2;
}

message ClaimPickingTaskRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
}

message ClaimPickingTaskResponse {
  PickingTask task = 1;
}

message ConfirmPickingRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
  repeated string handling_unit_ids = 5 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

message ConfirmPickingResponse {
  PickingTask task = 1;
}

message ConfirmWarehouseShipmentRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
}

message ConfirmWarehouseShipmentResponse {
  PickingTask task = 1;
}

service WarehousePickingService {
  rpc ListPickingTasks(ListPickingTasksRequest) returns (ListPickingTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "task_view"
      scope_field: "warehouse_id"
    };
  }
  rpc ClaimPickingTask(ClaimPickingTaskRequest) returns (ClaimPickingTaskResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc ConfirmPicking(ConfirmPickingRequest) returns (ConfirmPickingResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc ConfirmWarehouseShipment(ConfirmWarehouseShipmentRequest) returns (ConfirmWarehouseShipmentResponse) {
    option (common.v1.access).permission = {
      name: "task_edit"
      scope_field: "warehouse_id"
    };
  }
}

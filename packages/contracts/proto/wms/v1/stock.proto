syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "catalog/v1/catalog.proto";
import "common/v1/date.proto";
import "common/v1/method_options.proto";
import "common/v1/page.proto";
import "google/protobuf/timestamp.proto";

enum HandlingUnitKind {
  HANDLING_UNIT_KIND_UNSPECIFIED = 0;
  HANDLING_UNIT_KIND_PALLET = 1;
  HANDLING_UNIT_KIND_BOX = 2;
}

enum StockStatus {
  STOCK_STATUS_UNSPECIFIED = 0;
  STOCK_STATUS_AVAILABLE = 1;
  STOCK_STATUS_RESERVED = 2;
  STOCK_STATUS_QUARANTINE = 3;
  STOCK_STATUS_DEFECTIVE = 4;
}

enum StockMovementKind {
  STOCK_MOVEMENT_KIND_UNSPECIFIED = 0;
  STOCK_MOVEMENT_KIND_OPENING_BALANCE = 1;
  STOCK_MOVEMENT_KIND_TRANSFER = 2;
}

message Batch {
  string id = 1;
  string tenant_id = 2;
  string product_id = 3;
  string number = 4;
  common.v1.CalendarDate expires_on = 5;
  catalog.v1.BaseUnit base_unit = 6;
}

message StockLine {
  Batch batch = 1;
  StockStatus status = 2;
  int64 quantity_base = 3;
}

message HandlingUnit {
  string id = 1;
  string tenant_id = 2;
  string warehouse_id = 3;
  string sscc = 4;
  HandlingUnitKind kind = 5;
  int32 version = 6;
}

message StockBalance {
  HandlingUnit handling_unit = 1;
  string cell_id = 2;
  repeated StockLine lines = 3;
}

message StockMovement {
  string id = 1;
  string tenant_id = 2;
  string warehouse_id = 3;
  StockMovementKind kind = 4;
  HandlingUnit handling_unit = 5;
  optional string from_cell_id = 6;
  string to_cell_id = 7;
  repeated StockLine lines = 8;
  string source_document_number = 9;
  string actor_user_id = 10;
  google.protobuf.Timestamp occurred_at = 11;
}

message OpeningStockLine {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  string batch_number = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  common.v1.CalendarDate expires_on = 3;
  StockStatus status = 4 [(buf.validate.field).enum = {
    in: [
      1,
      3,
      4
    ]
  }];
  int64 quantity_base = 5 [(buf.validate.field).int64.gt = 0];
}

message PostOpeningStockRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 2 [(buf.validate.field).string.uuid = true];
  string cell_id = 3 [(buf.validate.field).string.uuid = true];
  string sscc = 4 [(buf.validate.field).string.pattern = "^[0-9]{18}$"];
  HandlingUnitKind kind = 5 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  repeated OpeningStockLine lines = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
  string source_document_number = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message PostOpeningStockResponse {
  StockBalance balance = 1;
  StockMovement movement = 2;
}

message MoveHandlingUnitRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  string idempotency_key = 2 [(buf.validate.field).string.uuid = true];
  string handling_unit_id = 3 [(buf.validate.field).string.uuid = true];
  int32 expected_version = 4 [(buf.validate.field).int32.gt = 0];
  string to_cell_id = 5 [(buf.validate.field).string.uuid = true];
  string source_document_number = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message MoveHandlingUnitResponse {
  StockBalance balance = 1;
  StockMovement movement = 2;
}

message ListStockBalancesRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListStockBalancesResponse {
  repeated StockBalance balances = 1;
  common.v1.PageResponse page = 2;
}

message ListStockMovementsRequest {
  string warehouse_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.PageRequest page = 2;
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
  common.v1.PageResponse page = 2;
}

service WarehouseStockService {
  rpc PostOpeningStock(PostOpeningStockRequest) returns (PostOpeningStockResponse) {
    option (common.v1.access).permission = {
      name: "inventory_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc MoveHandlingUnit(MoveHandlingUnitRequest) returns (MoveHandlingUnitResponse) {
    option (common.v1.access).permission = {
      name: "inventory_edit"
      scope_field: "warehouse_id"
    };
  }
  rpc ListStockBalances(ListStockBalancesRequest) returns (ListStockBalancesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "inventory_view"
      scope_field: "warehouse_id"
    };
  }
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission = {
      name: "inventory_view"
      scope_field: "warehouse_id"
    };
  }
}

syntax = "proto3";

package wms.v1;

import "buf/validate/validate.proto";
import "common/v1/method_options.proto";

message YardQueueWeights {
  optional uint32 explicit_urgency_weight = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 100
  ];
  optional uint32 cargo_urgency_weight = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 100
  ];
  optional uint32 delivery_window_weight = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 100
  ];
  optional uint32 waiting_time_weight = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 100
  ];
  optional uint32 resource_availability_weight = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 100
  ];
}

message YardQueuePolicy {
  string organization_id = 1;
  int64 version = 2;
  YardQueueWeights weights = 3;
}

message GetYardQueuePolicyRequest {}

message GetYardQueuePolicyResponse {
  YardQueuePolicy policy = 1;
}

message SaveYardQueuePolicyRequest {
  YardQueueWeights weights = 1 [(buf.validate.field).required = true];
  optional int64 expected_version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gte = 0
  ];
  string idempotency_key = 3 [(buf.validate.field).string.uuid = true];
}

message SaveYardQueuePolicyResponse {
  YardQueuePolicy policy = 1;
}

service YardQueuePolicyService {
  rpc GetYardQueuePolicy(GetYardQueuePolicyRequest) returns (GetYardQueuePolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (common.v1.access).permission.name = "yard_view";
  }
  rpc SaveYardQueuePolicy(SaveYardQueuePolicyRequest) returns (SaveYardQueuePolicyResponse) {
    option (common.v1.access).permission.name = "yard_manage";
  }
}
